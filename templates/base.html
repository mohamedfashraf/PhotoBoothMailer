<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="{{ theme_color }}">
  <title>{% block title %}{{ event_name }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  {% if brand_css %}<style>{{ brand_css|safe }}</style>{% endif %}
</head>
<body>
  <main class="wrap">
    <header class="brand">
      {% if logo_version %}
      <img class="logo-img" src="/brand/logo.png?v={{ logo_version }}" alt="">
      {% else %}
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
      </span>
      {% endif %}
      <span class="event" dir="auto">{{ event_name }}</span>
    </header>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
